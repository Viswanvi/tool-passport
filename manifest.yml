modules:
  jira:globalPage:
    - key: passport-home            # Ask, My tools (owners), Changes. Phase 0: also the temporary Experiments panel
      resource: ui
      resolver:
        function: ui-resolver
      render: native
      title: Tool Passport
  jira:adminPage:
    - key: passport-setup           # setup wizard, demo seed and reset, test runs (Phase 4)
      resource: ui
      resolver:
        function: ui-resolver
      render: native
      title: Tool Passport setup
  trigger:
    - key: app-lifecycle            # runs SQL migrations on install and major upgrade
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    - key: issue-events             # E5 now; the request loop's re-check on resolution in Phase 1
      function: on-issue-event
      events:
        - avi:jira:updated:issue
  scheduledTrigger:
    - key: five-minute-sweep        # module keys are unique across types; the function is "sweep"
      function: sweep
      interval: fiveMinute          # E10 checks the cadence
  sql:
    - key: main
      engine: mysql
  llm:
    - key: translator
      model:
        - claude
  function:
    - key: ui-resolver
      handler: index.uiResolver
    - key: on-lifecycle
      handler: index.onLifecycle
    - key: sweep
      handler: index.sweep
    - key: on-issue-event
      handler: index.onIssueEvent
resources:
  - key: ui
    path: src/frontend/index.tsx
permissions:
  scopes:                           # map form: required once any scope allows impersonation
    read:jira-work: {}
    write:jira-work: {}
    read:jira-user:
      allowImpersonation: true      # E6: keep only if group reads in triggers need it
    read:servicedesk-request:
      allowImpersonation: true      # Assets workspace lookup; E1 impersonation path
    write:servicedesk-request: {}
    manage:servicedesk-customer: {} # E5: add the asker as a desk customer if raiseOnBehalfOf needs it
    read:group:jira: {}             # E6 / demo seed: find the demo groups (verified by a real call, D21)
    write:group:jira: {}            # E6 / demo seed: create the demo groups and add the judge
    read:cmdb-object:jira:
      allowImpersonation: true      # E1: keep only if the impersonation path is chosen
    write:cmdb-object:jira: {}      # setup wizard and demo seed only
    read:cmdb-schema:jira:
      allowImpersonation: true
    write:cmdb-schema:jira: {}      # setup wizard creates the schema
    read:cmdb-type:jira:
      allowImpersonation: true
    write:cmdb-type:jira: {}
    read:cmdb-attribute:jira:
      allowImpersonation: true
    write:cmdb-attribute:jira: {}
    read:cmdb-icon:jira: {}         # object type creation needs an icon id
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/116e4a95-46a5-4008-8a77-9177f8e23ed0
